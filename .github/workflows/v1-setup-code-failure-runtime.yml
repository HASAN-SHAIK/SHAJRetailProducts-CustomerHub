name: V1 CustomerHub Setup Code Failure Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked install
        run: npm ci --no-audit --no-fund
      - name: Focused setup-code failure automated acceptance
        run: node scripts/setup-code-failure.acceptance.mjs
      - name: Relevant dashboard acceptance
        run: npm run test:dashboard
      - name: Native customer acceptance
        id: native_customers
        continue-on-error: true
        run: npm run test:customers
      - name: Production build against isolated Central boundary
        env:
          VITE_CENTRAL_API_URL: http://127.0.0.1:43159/api
          VITE_POS_SERVICE_URL: http://127.0.0.1:43160
        run: npm run build
      - name: Install isolated browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start real production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4185 > /tmp/customerhub-setup-code-failure-preview.log 2>&1 &
          echo $! > /tmp/customerhub-setup-code-failure-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4185/pos-setup >/dev/null; then
              echo "CUSTOMERHUB_SETUP_CODE_FAILURE_PREVIEW_READY=true"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/customerhub-setup-code-failure-preview.log
          exit 1
      - name: Real browser setup-code failure verification
        run: |
          set -o pipefail
          APP_URL=http://127.0.0.1:4185/pos-setup CENTRAL_MOCK_PORT=43159 node scripts/setup-code-failure-runtime.mjs 2>&1 | tee /tmp/setup-code-failure-runtime.log
      - name: Verify application remained healthy
        if: always()
        run: |
          set -euo pipefail
          test -s /tmp/customerhub-setup-code-failure-preview.pid
          kill -0 "$(cat /tmp/customerhub-setup-code-failure-preview.pid)"
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4185/pos-setup)
          test "$status" = "200"
          echo "CUSTOMERHUB_SETUP_CODE_FAILURE_PROCESS_ALIVE=true"
          echo "CUSTOMERHUB_SETUP_CODE_FAILURE_ROUTE_HTTP=$status"
          cat /tmp/customerhub-setup-code-failure-preview.log
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-c-setup-code-failure-evidence
          path: |
            /tmp/setup-code-failure-runtime.log
            /tmp/customerhub-setup-code-failure-preview.log
          if-no-files-found: warn
      - name: Certification result
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.native_customers.outcome }}" = "success"
          grep -q 'CUSTOMERHUB_SETUP_CODE_FAILURE_RUNTIME_PASS=true' /tmp/setup-code-failure-runtime.log
