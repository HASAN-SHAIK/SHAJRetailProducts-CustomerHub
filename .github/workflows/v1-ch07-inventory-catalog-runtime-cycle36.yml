name: V1 CH-07 inventory catalog runtime cycle36

on:
  push:
    branches: [test/ch07-inventory-catalog-runtime-cycle36]
  workflow_dispatch:

jobs:
  ch07-inventory-catalog-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused inventory catalog acceptance
        run: node scripts/inventory-product-catalog.acceptance.mjs
      - name: Repository inventory catalog package gate
        id: package_gate
        continue-on-error: true
        run: npm run test:inventory-catalog
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4199 > /tmp/ch07-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4199/inventory/catalog >/tmp/ch07.html && break; sleep 1; done
          test -s /tmp/ch07.html
      - name: Real Chromium inventory catalog runtime
        id: runtime
        continue-on-error: true
        run: |
          cat > ch07-runtime.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const calls = [];
          page.on('request', r => {
            if (r.url().includes('/api/')) {
              const u = new URL(r.url());
              calls.push(`${r.method()} ${u.pathname}${u.search}`);
            }
          });
          const legacyProduct={id:'legacy-1',name:'Legacy Runtime Milk',barcode:'8901234567890',company:'SHAJ Foods',category:'Dairy',selling_price:63,purchase_price:50,gst_percentage:5,stock_quantity:9};
          const canonicalProduct={id:'v1-1',name:'Canonical Runtime Milk',barcode:'8901234567890',company:'SHAJ Foods',category:'Dairy',selling_price:63,mrp:65,purchase_price:50,gst_percentage:5,hsn_code:'0401',branch_id:'branch-1',is_batch_enabled:true,updated_at:'2026-09-01T00:00:00Z',inventory:{projected_net_quantity:12,sellable_quantity:10,physical_quantity:14,expired_quantity:2,provisional_deficit:2}};
          await page.route('http://localhost:5001/api/**', async route => {
            const r=route.request(), u=new URL(r.url()), p=u.pathname;
            let body={data:{}};
            if (p.endsWith('/auth/getLogin')) body={user:{id:'admin-1',name:'Runtime Admin',role:'admin'}};
            else if (p.endsWith('/settings/application')) body={data:{}};
            else if (p.endsWith('/branches')) body={data:[{id:'branch-1',branch_id:'branch-1',name:'Main Store',branch_name:'Main Store'}]};
            else if (p.endsWith('/products') && !p.endsWith('/v1/products')) body={data:{products:[legacyProduct]}};
            else if (p.endsWith('/v1/categories')) body={data:{categories:[{name:'Dairy',product_count:1}]},meta:{total:1,page:1,limit:200,total_pages:1}};
            else if (p.endsWith('/v1/products')) body={data:{products:[canonicalProduct]},meta:{page:1,limit:25,total:1,total_pages:1}};
            await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(body)});
          });
          await page.goto('http://127.0.0.1:4199/inventory/catalog',{waitUntil:'networkidle'});
          await page.waitForTimeout(500);
          let text=await page.locator('body').innerText();
          const routeOk=page.url().endsWith('/inventory/catalog');
          const title=text.includes('Product Catalog');
          const legacyRendered=text.includes('Legacy Runtime Milk');
          const canonicalRendered=text.includes('Canonical Runtime Milk');
          const centralAuthority=text.includes('Central product master');
          const truthBoundary=text.includes('Inventory truth boundary');
          const projectionFacts=text.includes('projected')&&text.includes('Sellable')&&text.includes('Physical');
          const legacyGet=calls.some(x=>x.startsWith('GET /api/products'));
          const canonicalGet=calls.some(x=>x.startsWith('GET /api/v1/products'));
          const categoriesGet=calls.some(x=>x.startsWith('GET /api/v1/categories'));
          const legacySearch=page.getByPlaceholder('Name, company, barcode');
          const legacySearchPresent=await legacySearch.count()>0;
          if(legacySearchPresent){await legacySearch.fill('Milk');await page.getByRole('button',{name:'Search'}).click();await page.waitForTimeout(400);}
          const legacySearchCall=calls.some(x=>x.startsWith('GET /api/products?')&&x.includes('search=Milk'));
          const certifiedSearchPresent=await page.getByPlaceholder('Product, brand/company or barcode').count()>0;
          const posLocalCall=calls.some(x=>x.includes('/status')||x.includes('/diagnostics')||x.includes('/sync'));
          console.log(`CH07_ROUTE=${routeOk}`);
          console.log(`CH07_TITLE=${title}`);
          console.log(`CH07_LEGACY_PRODUCT_RENDERED=${legacyRendered}`);
          console.log(`CH07_CANONICAL_PRODUCT_RENDERED=${canonicalRendered}`);
          console.log(`CH07_CENTRAL_AUTHORITY=${centralAuthority}`);
          console.log(`CH07_TRUTH_BOUNDARY=${truthBoundary}`);
          console.log(`CH07_PROJECTION_FACTS=${projectionFacts}`);
          console.log(`CH07_LEGACY_PRODUCTS_GET=${legacyGet}`);
          console.log(`CH07_CANONICAL_V1_PRODUCTS_GET=${canonicalGet}`);
          console.log(`CH07_CATEGORIES_GET=${categoriesGet}`);
          console.log(`CH07_LEGACY_SEARCH_PRESENT=${legacySearchPresent}`);
          console.log(`CH07_LEGACY_SEARCH_CALL=${legacySearchCall}`);
          console.log(`CH07_CERTIFIED_SEARCH_PRESENT=${certifiedSearchPresent}`);
          console.log(`CH07_POS_LOCAL_CALL=${posLocalCall}`);
          console.log(`CH07_CALLS=${calls.join(' | ')}`);
          const certifiedRuntime=routeOk&&title&&canonicalRendered&&centralAuthority&&truthBoundary&&projectionFacts&&canonicalGet&&categoriesGet&&certifiedSearchPresent&&!legacyGet&&!posLocalCall;
          if(!certifiedRuntime){console.error('CH07_RUNTIME_CERTIFIED_CATALOG_NOT_LIVE');process.exitCode=1}else console.log('CH07_RUNTIME_UI_PASS');
          await browser.close();
          EOF
          node ch07-runtime.mjs
      - name: Preview log
        if: always()
        run: cat /tmp/ch07-preview.log || true
      - name: Certification result
        if: always()
        run: |
          echo "PACKAGE_GATE_OUTCOME=${{ steps.package_gate.outcome }}"
          echo "RUNTIME_OUTCOME=${{ steps.runtime.outcome }}"
          if [ "${{ steps.package_gate.outcome }}" != "success" ]; then echo "CH07_PACKAGE_GATE_FAIL"; exit 1; fi
          if [ "${{ steps.runtime.outcome }}" != "success" ]; then echo "CH07_RUNTIME_CERT_FAIL"; exit 1; fi
          echo "CH07_CERTIFICATION_LAYER_PASS"
