name: Customer Hub CI

on:
  push:
    branches: [main, agent/retail-hub-v1]
  pull_request:
    branches: [main, inventory/product-catalog-v1, inventory/product-editor-v1, inventory/suppliers-v1, inventory/purchase-entry-v1, inventory/purchase-book-v1, inventory/purchase-returns-v1, inventory/stock-adjustments-v1, inventory/analytics-v1, inventory/policies-v1]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test:dashboard
      - run: npm run test:customers
      - run: npm run test:staff
      - run: npm run test:expenses
      - run: npm run test:accounts
      - run: npm run test:inventory-catalog
      - run: npm run test:inventory-editor
      - run: npm run test:inventory-suppliers
      - run: npm run test:inventory-purchase-entry
      - run: npm run test:inventory-purchase-book
      - run: npm run test:inventory-purchase-returns
      - run: npm run test:inventory-stock-adjustments
      - run: npm run test:inventory-analytics
      - run: npm run test:inventory-policies
      - run: npm run test:inventory-release
      - run: npm run build
