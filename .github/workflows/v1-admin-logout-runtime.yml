name: V1 CustomerHub Admin Logout Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact head
        run: |
          echo "EXPECTED=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "ACTUAL=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Locked install
        run: npm ci --no-audit --no-fund

      - name: Focused admin logout acceptance
        id: focused
        continue-on-error: true
        run: node scripts/admin-logout.acceptance.mjs

      - name: Existing acceptance suite
        id: suite
        continue-on-error: true
        run: |
          set -e
          for f in scripts/*.acceptance.mjs; do
            if [ "$f" = "scripts/admin-logout.acceptance.mjs" ]; then continue; fi
            echo "=== $f ==="
            node "$f"
          done

      - name: Production build against isolated Central boundary
        id: build
        continue-on-error: true
        env:
          VITE_CENTRAL_API_URL: http://127.0.0.1:43161/api
          VITE_POS_SERVICE_URL: http://127.0.0.1:43162
        run: npm run build

      - name: Install browser runtime
        if: steps.build.outcome == 'success'
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start real production preview
        if: steps.build.outcome == 'success'
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4193 > /tmp/customerhub-admin-logout-preview.log 2>&1 &
          echo $! > /tmp/customerhub-admin-logout-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4193/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/customerhub-admin-logout-preview.log
          exit 1

      - name: Real browser admin logout verification
        id: runtime
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          APP_URL: http://127.0.0.1:4193/
          CENTRAL_MOCK_PORT: '43161'
        run: |
          set -o pipefail
          node scripts/admin-logout-runtime.mjs 2>&1 | tee /tmp/admin-logout-runtime.log

      - name: Verify preview process remains healthy
        id: health
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          test -s /tmp/customerhub-admin-logout-preview.pid
          kill -0 "$(cat /tmp/customerhub-admin-logout-preview.pid)"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4193/)" = "200"

      - name: Record exact evidence on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Exact-head CustomerHub admin-logout evidence'
            echo
            echo '```text'
            echo "HEAD=$(git rev-parse HEAD 2>/dev/null || true)"
            echo "focused=${{ steps.focused.outcome }}"
            echo "suite=${{ steps.suite.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "runtime=${{ steps.runtime.outcome }}"
            echo "health=${{ steps.health.outcome }}"
            if [ -f /tmp/admin-logout-runtime.log ]; then cat /tmp/admin-logout-runtime.log; fi
            echo '```'
          } > /tmp/evidence.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/evidence.md

      - name: Certification verdict
        if: always()
        run: |
          test "${{ steps.focused.outcome }}" = success
          test "${{ steps.suite.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.runtime.outcome }}" = success
          test "${{ steps.health.outcome }}" = success
