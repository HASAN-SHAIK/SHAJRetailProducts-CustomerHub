name: V1 CH-15 Policies Runtime Cycle29

on:
  pull_request:
    branches: [main]

jobs:
  ch15-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Focused raw acceptance
        continue-on-error: true
        run: node scripts/inventory-policies.acceptance.mjs
      - name: Repository package gate
        continue-on-error: true
        run: npm run test:inventory-policies
      - name: Build production bundle
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4192 > /tmp/ch15-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4192/inventory/policies >/tmp/ch15.html && break; sleep 1; done
          test -s /tmp/ch15.html
      - name: Real Chromium policy-route verification
        run: |
          cat > ./ch15-runtime.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const calls = [];
          await page.route('**/api/**', async route => {
            const u = new URL(route.request().url()); calls.push(`${route.request().method()} ${u.pathname}${u.search}`);
            const p = u.pathname; let body = {};
            if (p.includes('/auth/getLogin')) body = { id: 1, name: 'Runtime Admin', role: 'admin', email: 'runtime@example.com' };
            else if (p.includes('/branches')) body = { data: [{id:'branch-001', name:'Runtime Store'}] };
            else if (p.includes('/configuration/catalog')) body = { data: [] };
            else if (p.includes('/configuration')) body = { data: {} };
            else if (p.includes('/settings/application')) body = { data: {} };
            await route.fulfill({status:200, contentType:'application/json', body:JSON.stringify(body)});
          });
          await page.goto('http://127.0.0.1:4192/inventory/policies', {waitUntil:'networkidle'});
          const finalUrl = page.url(); const text = await page.locator('body').innerText();
          const routeRendered = finalUrl.endsWith('/inventory/policies');
          const titleRendered = text.includes('Inventory Policies');
          const boundaryRendered = text.includes('Inventory policy authority');
          const hierarchyRendered = text.includes('System → Business → Store → POS');
          console.log(`CH15_ROUTE_RENDERED=${routeRendered}`);
          console.log(`CH15_TITLE_RENDERED=${titleRendered}`);
          console.log(`CH15_POLICY_BOUNDARY_RENDERED=${boundaryRendered}`);
          console.log(`CH15_HIERARCHY_RENDERED=${hierarchyRendered}`);
          console.log(`CH15_CALLS=${calls.join(' | ')}`);
          await browser.close();
          if (!routeRendered || !titleRendered || !boundaryRendered || !hierarchyRendered) { console.error('CH15_RUNTIME_CERTIFIED_WRAPPER_MISSING'); process.exit(1); }
          console.log('CH15_RUNTIME_UI_PASS');
          EOF
          node ./ch15-runtime.mjs
      - name: Preview log
        if: always()
        run: cat /tmp/ch15-preview.log || true
