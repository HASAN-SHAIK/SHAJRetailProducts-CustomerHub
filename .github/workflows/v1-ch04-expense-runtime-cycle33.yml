name: V1 CH-04 expense runtime cycle33

on:
  push:
    branches:
      - test/ch04-expense-runtime-cycle33
  workflow_dispatch:

jobs:
  ch04-expense-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused expense acceptance
        run: |
          node scripts/expense-migration.acceptance.mjs
          npm run test:expenses
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4196 > /tmp/ch04-preview.log 2>&1 &
          echo $! > /tmp/ch04-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4196/finance/expenses >/tmp/ch04.html; then break; fi
            sleep 1
          done
          test -s /tmp/ch04.html
          echo "CH04_PREVIEW_BYTES=$(wc -c </tmp/ch04.html)"
      - name: Real Chromium expense runtime verification
        run: |
          cat > ./ch04-runtime.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const calls=[];
          const posts=[];
          let expenses=[{id:'exp-1',expenseId:'exp-1',type:'shop',category:'Utilities',amount:1250,notes:'Runtime electricity bill',branchName:'Runtime Branch',date:'2026-08-31',status:'Approved'}];
          page.on('request', req => { if (req.url().includes('/api/')) calls.push(`${req.method()} ${new URL(req.url()).pathname}${new URL(req.url()).search}`); });
          await page.route('http://localhost:5001/api/**', async route => {
            const req=route.request(); const u=new URL(req.url()); const p=u.pathname; const method=req.method();
            let body={data:{}}; let status=200;
            if (p.endsWith('/auth/getLogin')) body={user:{id:'admin-1',name:'Runtime Admin',role:'admin'}};
            else if (p.endsWith('/settings/application')) body={data:{}};
            else if (p.endsWith('/branches') && method==='GET') body={data:[{id:'branch-001',branch_id:'branch-001',name:'Runtime Branch',branch_name:'Runtime Branch'}]};
            else if (p.endsWith('/v1/staff') && method==='GET') body={data:{staff:[{id:'staff-1',staffId:'staff-1',name:'Runtime Staff'}]}};
            else if (p.endsWith('/expenses') && method==='GET') body={data:{expenses}};
            else if (p.endsWith('/expenses') && method==='POST') {
              const payload=req.postDataJSON(); posts.push(payload);
              const created={id:'exp-2',expenseId:'exp-2',type:payload.type,category:payload.category,amount:payload.amount,notes:payload.notes || '',branchName:'Runtime Branch',date:payload.date || '2026-08-31',status:'Approved'};
              expenses=[created,...expenses]; body={data:{expense:created}};
            }
            await route.fulfill({status,contentType:'application/json',body:JSON.stringify(body)});
          });
          await page.goto('http://127.0.0.1:4196/finance/expenses',{waitUntil:'networkidle'});
          let text=await page.locator('body').innerText();
          const routeRendered=page.url().endsWith('/finance/expenses');
          const title=text.includes('Expense Management');
          const authority=text.includes('Central/PostgreSQL is the source of truth');
          const boundary=text.includes('POS remains responsible only for store-execution cash actions');
          const initial=text.includes('Runtime electricity bill') && text.includes('Utilities');
          const canonicalGet=calls.some(x=>x.startsWith('GET /api/expenses'));
          await page.getByRole('button',{name:/Add Expense/}).first().click();
          await page.getByLabel('Category').fill('Maintenance');
          await page.getByLabel('Amount').fill('875');
          await page.getByLabel('Notes').fill('Runtime AC maintenance');
          await page.locator('#expense-form button.primary-btn').click();
          await page.waitForFunction(() => document.body.innerText.includes('Runtime AC maintenance'));
          text=await page.locator('body').innerText();
          const created=text.includes('Runtime AC maintenance') && text.includes('Maintenance');
          const canonicalPost=calls.some(x=>x==='POST /api/expenses');
          const postPayloadOk=posts.length===1 && posts[0].type==='shop' && posts[0].category==='Maintenance' && Number(posts[0].amount)===875;
          const refreshedGets=calls.filter(x=>x.startsWith('GET /api/expenses')).length >= 2;
          const posCall=calls.some(x=>x.includes('/api/v1/status') || x.includes('/api/v1/diagnostics') || x.includes('/api/v1/sync'));
          console.log(`CH04_ROUTE_RENDERED=${routeRendered}`);
          console.log(`CH04_TITLE_RENDERED=${title}`);
          console.log(`CH04_AUTHORITY_RENDERED=${authority}`);
          console.log(`CH04_POS_BOUNDARY_RENDERED=${boundary}`);
          console.log(`CH04_INITIAL_EXPENSE_RENDERED=${initial}`);
          console.log(`CH04_CANONICAL_EXPENSE_GET=${canonicalGet}`);
          console.log(`CH04_CREATED_EXPENSE_RENDERED=${created}`);
          console.log(`CH04_CANONICAL_EXPENSE_POST=${canonicalPost}`);
          console.log(`CH04_CREATE_PAYLOAD_OK=${postPayloadOk}`);
          console.log(`CH04_REFRESHED_AFTER_CREATE=${refreshedGets}`);
          console.log(`CH04_POS_AUTHORITY_CALL=${posCall}`);
          console.log(`CH04_CALLS=${calls.join(' | ')}`);
          if (!(routeRendered && title && authority && boundary && initial && canonicalGet && created && canonicalPost && postPayloadOk && refreshedGets && !posCall)) {
            console.error('CH04_RUNTIME_FAIL'); process.exitCode=1;
          } else console.log('CH04_RUNTIME_UI_PASS');
          await browser.close();
          EOF
          node ./ch04-runtime.mjs
      - name: Preview log
        if: always()
        run: cat /tmp/ch04-preview.log || true
