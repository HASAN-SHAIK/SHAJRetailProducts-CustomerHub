name: V1 CH-05 Accounts Runtime Verification

on:
  push:
    branches: [test/ch05-accounts-runtime-cycle89]
  pull_request:
    branches: [main]

jobs:
  ch05-accounts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused accounting acceptance
        id: focused
        continue-on-error: true
        run: npm run test:accounts
      - name: Production build
        id: build
        run: npm run build
      - name: Install browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4205 > /tmp/ch05-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4205/finance/accounts >/tmp/ch05.html; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4205/finance/accounts >/tmp/ch05.html
          grep -q '<div id="root"></div>' /tmp/ch05.html
          cat /tmp/ch05-preview.log
      - name: Real browser accounting path
        id: runtime
        run: |
          cat > ./ch05-runtime.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const calls = [];
          const receiptPosts = [];
          const pageErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error)));

          await page.route('http://localhost:5001/api/**', async route => {
            const req = route.request();
            const url = new URL(req.url());
            calls.push(`${req.method()} ${url.pathname}${url.search}`);
            let body = { data: {} };
            if (url.pathname === '/api/auth/getLogin') {
              body = { data: { user: { id: 1, name: 'Runtime Admin', email: 'admin@runtime.test', role: 'admin' } } };
            } else if (url.pathname === '/api/settings/application') {
              body = { data: { settings: {} } };
            } else if (url.pathname === '/api/accounts/cashbook') {
              body = { data: { entries: [{ id: 501, reference: 'CASH-501', amount: 1250, type: 'receipt' }] } };
            } else if (url.pathname === '/api/accounts/bankbook') {
              body = { data: { entries: [{ id: 601, reference: 'BANK-601', amount: 2400, type: 'bank' }] } };
            } else if (url.pathname === '/api/accounts/receipt' && req.method() === 'POST') {
              const payload = req.postDataJSON();
              receiptPosts.push(payload);
              body = { data: { id: 701, ...payload } };
            } else if (url.pathname === '/api/accounts/receipt') {
              body = { data: { receipts: [{ id: 701, customer_id: 101, amount: 99.5, payment_mode: 'cash' }] } };
            }
            await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });
          });

          const response = await page.goto('http://127.0.0.1:4205/finance/accounts', { waitUntil: 'networkidle' });
          if (!response || response.status() !== 200) throw new Error(`Expected HTTP 200, got ${response?.status()}`);
          await page.getByRole('heading', { name: 'Financial Overview' }).waitFor();
          await page.getByRole('heading', { name: 'Accounting views' }).waitFor();
          await page.getByText('CASH-501', { exact: true }).waitFor();
          if (!calls.some(x => x.includes('GET /api/accounts/cashbook'))) throw new Error('Canonical cashbook endpoint was not called');

          await page.getByRole('button', { name: 'Bank Book', exact: true }).click();
          await page.getByText('BANK-601', { exact: true }).waitFor();
          if (!calls.some(x => x.includes('GET /api/accounts/bankbook'))) throw new Error('Canonical bankbook endpoint was not called');

          const receiptPanel = page.getByRole('heading', { name: 'Receipt entry' }).locator('..').locator('..');
          await receiptPanel.getByLabel('Customer ID').fill('101');
          await receiptPanel.getByLabel('Amount').fill('99.50');
          await receiptPanel.getByRole('button', { name: 'Create receipt' }).click();
          await page.getByText('99.50', { exact: false }).waitFor().catch(() => {});
          if (receiptPosts.length !== 1) throw new Error(`Expected one receipt POST, got ${receiptPosts.length}`);
          const posted = receiptPosts[0];
          if (posted.customer_id !== 101 || posted.amount !== 99.5 || posted.payment_mode !== 'cash') throw new Error(`Unexpected receipt payload ${JSON.stringify(posted)}`);
          if (!posted.client_txn_id || typeof posted.client_txn_id !== 'string') throw new Error('Missing client_txn_id idempotency key');
          if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);

          const bodyText = await page.locator('body').innerText();
          console.log('CH05_HTTP_STATUS=200');
          console.log('CH05_CASHBOOK_RENDERED=true');
          console.log('CH05_BANKBOOK_RENDERED=true');
          console.log('CH05_RECEIPT_POST_COUNT=' + receiptPosts.length);
          console.log('CH05_RECEIPT_CLIENT_TXN_ID_PRESENT=' + Boolean(posted.client_txn_id));
          console.log('CH05_AUTHORITY_DECLARATION_PRESENT=' + bodyText.includes('Central/PostgreSQL accounting authority'));
          console.log('CH05_POS_BOUNDARY_DECLARATION_PRESENT=' + bodyText.includes('POS keeps only store-execution cash/register actions'));
          console.log('CH05_CALLS=' + calls.join(' | '));
          console.log('CH05_PAGE_ERRORS=[]');
          console.log('CH05_RUNTIME_PASS=true');
          await browser.close();
          EOF
          node ./ch05-runtime.mjs
      - name: Final scenario summary
        if: always()
        run: |
          echo "CH05_FOCUSED=${{ steps.focused.outcome }}"
          echo "CH05_BUILD=${{ steps.build.outcome }}"
          echo "CH05_RUNTIME=${{ steps.runtime.outcome }}"
          test "${{ steps.runtime.outcome }}" = "success"
