name: CH15 Inventory Policies Runtime

on:
  push:
    branches: [test/ch15-inventory-policies-runtime]
  pull_request:
    branches: [main]

jobs:
  ch15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused inventory policies acceptance
        id: focused
        continue-on-error: true
        run: node scripts/inventory-policies.acceptance.mjs
      - name: Check repository CI command wiring
        id: ci_command
        continue-on-error: true
        run: npm run test:inventory-policies
      - name: Build CustomerHub
        run: npm run build
      - name: Install Playwright runtime only
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start real CustomerHub preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4175 > /tmp/ch15-preview.log 2>&1 &
          echo $! > /tmp/ch15-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/ >/tmp/ch15-index.html; then exit 0; fi
            sleep 1
          done
          cat /tmp/ch15-preview.log
          exit 1
      - name: Exercise real Inventory Policies UI and API path
        run: |
          cat > /tmp/ch15-runtime.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const observed = [];
          await page.route('http://localhost:5001/api/**', async (route) => {
            const req = route.request();
            const url = new URL(req.url());
            observed.push({ method: req.method(), path: url.pathname, postData: req.postData() });
            const json = (body, status = 200) => route.fulfill({ status, contentType: 'application/json', body: JSON.stringify(body) });
            if (url.pathname === '/api/auth/getLogin') return json({ user: { id: 'admin-1', role: 'admin', name: 'Runtime Admin' } });
            if (url.pathname === '/api/configuration/catalog') return json({ settings: [
              { key: 'inventory.allow_negative_stock', group: 'inventory', type: 'boolean', scopes: ['tenant','branch','device'] }
            ] });
            if (url.pathname === '/api/branches') return json({ branches: [] });
            if (url.pathname === '/api/configuration/scopes/tenant/current' && req.method() === 'GET') return json({
              overrides: {}, effective: { values: { 'inventory.allow_negative_stock': false }, sources: { 'inventory.allow_negative_stock': { scope_type: 'system' } }, etag: 'etag-runtime-1234567890' }
            });
            if (url.pathname === '/api/configuration/scopes/tenant/current' && req.method() === 'PUT') return json({
              overrides: { 'inventory.allow_negative_stock': true }, effective: { values: { 'inventory.allow_negative_stock': true }, sources: { 'inventory.allow_negative_stock': { scope_type: 'tenant' } }, etag: 'etag-runtime-updated' }
            });
            return json({ message: `Unhandled ${req.method()} ${url.pathname}` }, 500);
          });

          await page.goto('http://127.0.0.1:4175/inventory/policies', { waitUntil: 'networkidle' });
          await page.getByRole('heading', { name: 'Inventory Policies' }).waitFor();
          await page.getByText('Allow Negative Stock', { exact: true }).waitFor();
          const select = page.locator('.config-input select').first();
          await select.waitFor();
          assert.equal(await select.inputValue(), 'false');
          await select.selectOption('true');
          await page.getByRole('button', { name: 'Save configuration' }).click();
          await page.getByText('Configuration saved. Effective values were recalculated.').waitFor();

          const put = observed.find((x) => x.method === 'PUT' && x.path === '/api/configuration/scopes/tenant/current');
          assert.ok(put, 'expected real UI to issue tenant configuration PUT');
          const body = JSON.parse(put.postData || '{}');
          assert.equal(body.values['inventory.allow_negative_stock'], true);
          console.log('RUNTIME_UI_PASS');
          console.log(JSON.stringify({ observed, heading: await page.getByRole('heading', { name: 'Inventory Policies' }).textContent() }, null, 2));
          await browser.close();
          EOF
          node /tmp/ch15-runtime.mjs
          echo '--- preview log ---'
          cat /tmp/ch15-preview.log
      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/ch15-preview.pid ]; then kill $(cat /tmp/ch15-preview.pid) || true; fi
      - name: Enforce scenario gates
        if: steps.focused.outcome != 'success' || steps.ci_command.outcome != 'success'
        run: |
          echo "Focused acceptance outcome: ${{ steps.focused.outcome }}"
          echo "Repository CI command outcome: ${{ steps.ci_command.outcome }}"
          exit 1
