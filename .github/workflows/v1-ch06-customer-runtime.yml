name: V1 CH-06 Customer Runtime Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [test/ch06-customer-runtime-cycle16]

jobs:
  ch06:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused customer acceptance
        id: focused
        continue-on-error: true
        run: npm run test:customers
      - name: Production build
        run: npm run build
      - name: Install browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4182 > /tmp/ch06-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4182/customers >/tmp/ch06.html; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4182/customers >/tmp/ch06.html
          grep -q '<div id="root"></div>' /tmp/ch06.html
          cat /tmp/ch06-preview.log
      - name: Real browser customer path
        id: runtime
        continue-on-error: true
        run: |
          cat > ./ch06-runtime.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const calls = [];
          await page.route('http://localhost:5001/api/**', async route => {
            const req = route.request();
            const url = new URL(req.url());
            calls.push(`${req.method()} ${url.pathname}${url.search}`);
            let body = { data: {} };
            if (url.pathname === '/api/auth/getLogin') {
              body = { data: { user: { id: 1, name: 'Runtime Admin', email: 'admin@runtime.test', role: 'admin' } } };
            } else if (url.pathname === '/api/settings/application') {
              body = { data: { settings: {} } };
            } else if (url.pathname === '/api/branches') {
              body = { data: { branches: [] } };
            } else if (url.pathname.startsWith('/api/v1/customers')) {
              body = { data: { customers: [{ id: 101, customer_id: 101, name: 'Runtime Customer', phone: '9000000001', credit_limit: 5000, outstanding_balance: 1250 }] } };
            }
            await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });
          });
          await page.goto('http://127.0.0.1:4182/customers', { waitUntil: 'networkidle' });
          await page.getByRole('heading', { name: 'Ananya Sharma' }).waitFor();
          await page.getByRole('heading', { name: 'Recent Purchases' }).waitFor();
          console.log('CH06_RUNTIME_UI_RENDERED');
          console.log('CH06_RUNTIME_CALLS=' + calls.join(' | '));
          const customerCalls = calls.filter(x => x.includes('/api/v1/customers'));
          if (customerCalls.length === 0) {
            console.error('CH06_RUNTIME_CUSTOMER_API_MISSING: /customers rendered without calling canonical /api/v1/customers');
            await browser.close();
            process.exit(2);
          }
          console.log('CH06_RUNTIME_CUSTOMER_API_PASS=' + customerCalls.join(' | '));
          await browser.close();
          EOF
          node ./ch06-runtime.mjs
      - name: Final gate
        if: always()
        run: |
          echo "focused=${{ steps.focused.outcome }} runtime=${{ steps.runtime.outcome }}"
          test "${{ steps.focused.outcome }}" = "success"
          test "${{ steps.runtime.outcome }}" = "success"
