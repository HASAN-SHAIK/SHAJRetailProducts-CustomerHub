name: V1 CH-03 Staff Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v1-ch03-staff-runtime.yml'

jobs:
  ch03-staff-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused CH-03 acceptance
        run: npm run test:staff
      - name: Production build
        run: npm run build
      - name: Install browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4179 > /tmp/ch03-preview.log 2>&1 &
          echo $! > /tmp/ch03-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4179/staff > /tmp/ch03-staff.html; then break; fi
            sleep 1
          done
          test -s /tmp/ch03-staff.html
          grep -q '<div id="root"></div>' /tmp/ch03-staff.html
          cat /tmp/ch03-preview.log
      - name: Exercise real Staff UI
        run: |
          cat > ch03-runtime.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const calls = [];

          await page.route('http://localhost:5001/api/**', async (route) => {
            const req = route.request();
            const url = new URL(req.url());
            const path = url.pathname;
            calls.push(`${req.method()} ${path}`);

            const json = (body, status = 200) => route.fulfill({
              status,
              contentType: 'application/json',
              body: JSON.stringify(body),
            });

            if (path === '/api/auth/getLogin') {
              return json({ user: { id: 'admin-1', name: 'Runtime Admin', role: 'admin' } });
            }
            if (path === '/api/v1/staff') {
              return json({ staff: [{
                staffId: 'STAFF-001',
                name: 'Asha Rao',
                phone: '9000000001',
                role: 'Cashier',
                salary: 18000,
                joinDate: '2026-01-10',
                status: 'active',
                branch_id: 'branch-001',
                salesContribution: 125000,
                orders: 42,
              }] });
            }
            if (path === '/api/branches') {
              return json([{ id: 'branch-001', store_number: 'STORE-001', name: 'Main Store', location: 'Hyderabad', is_active: true }]);
            }
            if (path === '/api/users') {
              return json({ users: [] });
            }
            if (path === '/api/v1/staff/salary') {
              return json({ salaries: [] });
            }
            if (path === '/api/expenses') {
              return json({ expenses: [] });
            }
            if (path === '/api/v1/staff/performance') {
              return json({ rows: [], summary: {} });
            }
            if (path === '/api/settings/application') {
              return json({});
            }
            return json({});
          });

          await page.goto('http://127.0.0.1:4179/staff', { waitUntil: 'networkidle' });
          await page.getByText('Asha Rao', { exact: true }).waitFor();
          await page.getByRole('cell', { name: 'Main Store', exact: true }).waitFor();
          await page.getByText('Central/PostgreSQL is authoritative for staff profile data.', { exact: true }).waitFor();
          await page.getByText('Login roles and permissions remain a separate access-control concern.', { exact: true }).waitFor();

          assert.ok(calls.includes('GET /api/v1/staff'), `Missing staff call: ${calls.join(', ')}`);
          assert.ok(calls.includes('GET /api/branches'), `Missing branches call: ${calls.join(', ')}`);
          assert.ok(calls.includes('GET /api/users'), `Missing users call: ${calls.join(', ')}`);
          assert.ok(calls.includes('GET /api/v1/staff/salary'), `Missing salary call: ${calls.join(', ')}`);
          assert.ok(calls.includes('GET /api/expenses'), `Missing expenses call: ${calls.join(', ')}`);
          assert.ok(calls.includes('GET /api/v1/staff/performance'), `Missing performance call: ${calls.join(', ')}`);

          console.log('CH03_RUNTIME_UI_PASS');
          console.log(`CH03_RUNTIME_CALLS=${calls.join('|')}`);
          await browser.close();
          EOF
          node ch03-runtime.mjs
      - name: Show runtime logs
        if: always()
        run: |
          cat /tmp/ch03-preview.log || true
          if test -f /tmp/ch03-preview.pid; then kill $(cat /tmp/ch03-preview.pid) || true; fi
