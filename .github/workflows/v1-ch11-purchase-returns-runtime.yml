name: V1 CH-11 Purchase Returns Runtime

on:
  push:
    branches: [test/v1-ch11-purchase-returns-runtime]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "CH11_EXPECTED_HEAD=$expected"
          echo "CH11_ACTUAL_HEAD=$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Focused existing acceptance
        id: focused
        continue-on-error: true
        run: node scripts/inventory-purchase-returns.acceptance.mjs
      - name: Repository package gate
        id: package
        continue-on-error: true
        run: npm run test:inventory-purchase-returns
      - name: Production build
        id: build
        run: npm run build
      - name: Install Playwright runtime only
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4187 > /tmp/ch11-preview.log 2>&1 &
          echo $! > /tmp/ch11-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4187/inventory/purchase-returns >/tmp/ch11-page.html; then
              echo "CH11_PREVIEW_HTTP_BYTES=$(wc -c </tmp/ch11-page.html)"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/ch11-preview.pid)" 2>/dev/null; then
              cat /tmp/ch11-preview.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/ch11-preview.log
          exit 1
      - name: Real browser canonical purchase-return verification
        id: runtime
        continue-on-error: true
        shell: bash
        run: |
          cat > ch11-runtime.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          page.setDefaultTimeout(8000);
          page.setDefaultNavigationTimeout(15000);
          const calls = [];
          const mutations = [];
          const pageErrors = [];
          let remaining = 5;
          let returns = [{ id: 401, purchase_id: 201, supplier_id: 101, supplier_name: 'V1 Runtime Supplier', created_at: '2026-08-30T10:00:00Z', reason: 'Damaged', total_amount: 250 }];
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('request', req => {
            if (!req.url().includes('/api/')) return;
            const u = new URL(req.url());
            const path = u.pathname.replace(/^\/api/, '');
            calls.push(`${req.method()} ${path}${u.search}`);
            if (req.method() !== 'GET') {
              let body = null;
              try { body = req.postDataJSON(); } catch {}
              mutations.push({ method: req.method(), path, body });
            }
          });
          await page.route('http://localhost:5001/api/**', async route => {
            const req = route.request();
            const u = new URL(req.url());
            const path = u.pathname.replace(/^\/api/, '');
            let body = { data: {} };
            if (path === '/auth/getLogin') body = { user: { id: 1, name: 'Runtime Admin', role: 'admin' } };
            else if (path === '/settings/application') body = { data: {} };
            else if (path === '/branches') body = { data: [{ id: 'branch-001', branch_id: 'branch-001', name: 'Main Store', branch_name: 'Main Store' }] };
            else if (path.startsWith('/purchase-returns')) body = { data: { returns: [{ id: 301, purchase_id: 201, supplier_id: 101, supplier_name: 'LEGACY-SHOULD-NOT-RENDER', created_at: '2026-08-30T10:00:00Z', reason: 'Legacy', total_amount: 1 }] } };
            else if (path.startsWith('/v1/purchase-returns') && req.method() === 'GET') body = { data: { returns } };
            else if (path === '/v1/purchase-returns' && req.method() === 'POST') {
              const payload = req.postDataJSON();
              remaining -= Number(payload?.items?.[0]?.quantity || 0);
              returns = [...returns, { id: 402, purchase_id: 201, supplier_id: 101, supplier_name: 'V1 Runtime Supplier', created_at: '2026-09-08T09:00:00Z', reason: payload.reason || null, total_amount: 100 }];
              body = { data: { purchase_return: returns.at(-1) } };
            }
            else if (path.startsWith('/v1/suppliers')) body = { data: { suppliers: [{ id: 101, name: 'V1 Runtime Supplier' }] } };
            else if (path === '/v1/purchases/201') body = { data: { order: { id: 201, supplier_id: 101, branch_id: 'branch-001' }, items: [{ product_id: 501, product_name: 'Runtime Product' }], batches: [{ id: 701, product_id: 501, batch_number: 'BATCH-01', quantity_remaining: remaining, purchase_price: 50 }] } };
            else if (path.startsWith('/v1/purchases')) body = { data: { purchases: [{ id: 201, supplier_id: 101, supplier_name: 'V1 Runtime Supplier', branch_id: 'branch-001', total_price: 500 }] } };
            await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });
          });

          let failed = false;
          try {
            const response = await page.goto('http://127.0.0.1:4187/inventory/purchase-returns', { waitUntil: 'networkidle' });
            let text = await page.locator('body').innerText();
            const routeRendered = text.includes('Purchase Returns');
            const canonicalRow = text.includes('V1 Runtime Supplier') && text.includes('Damaged');
            const legacyRow = text.includes('LEGACY-SHOULD-NOT-RENDER');
            const invariant = text.includes('Inventory invariant');

            const selects = page.locator('select');
            await selects.nth(2).selectOption('201');
            await page.getByText(/Runtime Product.*BATCH-01.*Remaining 5/).waitFor({ state: 'visible' });
            await selects.nth(3).selectOption('701');
            await page.getByLabel('Return quantity').fill('2');
            await page.getByLabel('Reason').fill('Damaged runtime return');
            await page.getByRole('button', { name: 'Record purchase return' }).click();
            await page.getByText('Return recorded', { exact: true }).waitFor({ state: 'visible' });
            await page.waitForTimeout(300);
            text = await page.locator('body').innerText();

            const post = mutations.find(x => x.method === 'POST' && x.path === '/v1/purchase-returns');
            const payloadOk = Boolean(post?.body && post.body.purchase_id === 201 && post.body.supplier_id === 101 && post.body.branch_id === 'branch-001' && post.body.reason === 'Damaged runtime return' && Array.isArray(post.body.items) && post.body.items.length === 1 && post.body.items[0].batch_id === 701 && post.body.items[0].product_id === 501 && Number(post.body.items[0].quantity) === 2);
            const canonicalGet = calls.some(c => c.startsWith('GET /v1/purchase-returns'));
            const canonicalPost = Boolean(post);
            const legacyGet = calls.some(c => c.startsWith('GET /purchase-returns'));
            const detailReads = calls.filter(c => c.startsWith('GET /v1/purchases/201')).length;
            const refreshedRemaining = text.includes('Remaining 3');
            const successVisible = text.includes('Purchase return recorded in Central');

            console.log(`CH11_APP_HTTP=${response?.status() || 0}`);
            console.log(`CH11_ROUTE_RENDERED=${routeRendered}`);
            console.log(`CH11_CANONICAL_ROW_RENDERED=${canonicalRow}`);
            console.log(`CH11_LEGACY_ROW_RENDERED=${legacyRow}`);
            console.log(`CH11_INVARIANT_VISIBLE=${invariant}`);
            console.log(`CH11_CANONICAL_V1_RETURN_GET=${canonicalGet}`);
            console.log(`CH11_CANONICAL_V1_RETURN_POST=${canonicalPost}`);
            console.log(`CH11_POST_PAYLOAD_OK=${payloadOk}`);
            console.log(`CH11_LEGACY_RETURN_GET=${legacyGet}`);
            console.log(`CH11_PURCHASE_DETAIL_READS=${detailReads}`);
            console.log(`CH11_REFRESHED_REMAINING=${refreshedRemaining}`);
            console.log(`CH11_SUCCESS_VISIBLE=${successVisible}`);
            console.log(`CH11_PAGE_ERRORS=${pageErrors.length}`);
            console.log(`CH11_CALLS=${calls.join(' | ')}`);
            const pass = response?.status() === 200 && routeRendered && canonicalRow && !legacyRow && invariant && canonicalGet && canonicalPost && payloadOk && !legacyGet && detailReads >= 2 && refreshedRemaining && successVisible && pageErrors.length === 0;
            console.log(`CH11_RUNTIME_PASS=${pass}`);
            if (!pass) failed = true;
          } catch (error) {
            console.error(`CH11_RUNTIME_EXCEPTION=${error?.message || error}`);
            failed = true;
          } finally {
            await browser.close();
          }
          if (failed) process.exit(1);
          EOF
          timeout 40s node ch11-runtime.mjs | tee /tmp/ch11-runtime.log
      - name: Post-runtime process and HTTP health
        id: health
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/ch11-preview.pid
          kill -0 "$(cat /tmp/ch11-preview.pid)"
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4187/inventory/purchase-returns)"
          echo "CH11_PROCESS_ALIVE=true"
          echo "CH11_POST_RUNTIME_HTTP=$code"
          test "$code" = 200
      - name: Final certification gate
        if: always()
        shell: bash
        run: |
          echo "CH11_FOCUSED=${{ steps.focused.outcome }}"
          echo "CH11_PACKAGE=${{ steps.package.outcome }}"
          echo "CH11_BUILD=${{ steps.build.outcome }}"
          echo "CH11_PREVIEW=${{ steps.preview.outcome }}"
          echo "CH11_RUNTIME=${{ steps.runtime.outcome }}"
          echo "CH11_HEALTH=${{ steps.health.outcome }}"
          test "${{ steps.focused.outcome }}" = success
          test "${{ steps.package.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.preview.outcome }}" = success
          test "${{ steps.runtime.outcome }}" = success
          test "${{ steps.health.outcome }}" = success
          echo 'CH11_CERTIFICATION=PASS'
