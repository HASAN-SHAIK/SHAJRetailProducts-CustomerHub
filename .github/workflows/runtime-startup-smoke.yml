name: CustomerHub Runtime Startup Smoke

on:
  push:
    branches: [test/customerhub-runtime-startup]
  pull_request:
    branches: [main]

jobs:
  automated-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Focused dashboard acceptance
        run: npm run test:dashboard
      - name: Focused customer acceptance
        run: npm run test:customers

  runtime-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium runtime harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start Vite preview and verify real HTTP path
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/customerhub-preview.log 2>&1 &
          echo $! > /tmp/customerhub-preview.pid

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ -o /tmp/customerhub-home.html; then
              break
            fi
            sleep 1
          done

          test -s /tmp/customerhub-home.html
          grep -q '<div id="root"></div>' /tmp/customerhub-home.html
          ASSET_PATH=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/customerhub-home.html | head -n1)
          test -n "$ASSET_PATH"
          curl --fail --silent "http://127.0.0.1:4173${ASSET_PATH}" -o /tmp/customerhub-app.js
          test -s /tmp/customerhub-app.js

          echo 'ENV01_HTTP_STARTUP=true'
          head -n 20 /tmp/customerhub-home.html
          cat /tmp/customerhub-preview.log
      - name: Real Chromium application startup verification
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            const failedRequests = [];

            page.on('pageerror', err => pageErrors.push(String(err)));
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('requestfailed', req => failedRequests.push(`${req.method()} ${req.url()} :: ${req.failure()?.errorText || 'failed'}`));

            // ENV-01 certifies the runnable CustomerHub frontend independently of Central availability.
            // Stub API traffic only; the real built JS bundle, router and React runtime execute in Chromium.
            await page.route('**/api/**', async route => {
              const req = route.request();
              const url = new URL(req.url());
              let body = {};
              if (url.pathname.includes('/auth/getLogin')) {
                body = { id: 'env01-user', name: 'ENV01 Runtime', role: 'admin', email: 'env01@example.test' };
              } else if (url.pathname.includes('/branches')) {
                body = { data: [], branches: [] };
              } else if (url.pathname.includes('/settings/application')) {
                body = {};
              }
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });
            });

            const response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(2500);

            const status = response?.status() || 0;
            const rootExists = await page.locator('#root').count() === 1;
            const rootHtml = rootExists ? await page.locator('#root').innerHTML() : '';
            const rootMounted = rootHtml.trim().length > 0;
            const bodyText = (await page.locator('body').innerText()).trim();
            const scriptCount = await page.locator('script[type="module"]').count();

            console.log(`ENV01_BROWSER_HTTP_STATUS=${status}`);
            console.log(`ENV01_BROWSER_ROOT_EXISTS=${rootExists}`);
            console.log(`ENV01_BROWSER_REACT_MOUNTED=${rootMounted}`);
            console.log(`ENV01_BROWSER_BODY_TEXT_LENGTH=${bodyText.length}`);
            console.log(`ENV01_BROWSER_MODULE_SCRIPTS=${scriptCount}`);
            console.log(`ENV01_BROWSER_PAGE_ERRORS=${JSON.stringify(pageErrors)}`);
            console.log(`ENV01_BROWSER_CONSOLE_ERRORS=${JSON.stringify(consoleErrors)}`);
            console.log(`ENV01_BROWSER_FAILED_REQUESTS=${JSON.stringify(failedRequests)}`);

            if (status !== 200 || !rootExists || !rootMounted || bodyText.length === 0 || scriptCount < 1 || pageErrors.length > 0) {
              throw new Error('CustomerHub real Chromium startup certification failed.');
            }

            console.log('ENV01_BROWSER_RUNTIME_PASS');
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
      - name: Dump preview log
        if: always()
        shell: bash
        run: |
          cat /tmp/customerhub-preview.log || true
          if [ -f /tmp/customerhub-preview.pid ]; then kill "$(cat /tmp/customerhub-preview.pid)" || true; fi
